spring:
  application:
    name: dify-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:dify}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_USE_SSL:false}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

dify:
  edition: ${EDITION:SELF_HOSTED}
  version: ${DIFY_VERSION:0.15.3}
  check-update-url: ${CHECK_UPDATE_URL:https://updates.dify.ai/api/v1/updates}
  init-password: ${INIT_PASSWORD:}
  security:
    secret-key: ${SECRET_KEY:your-secret-key}
  features:
    can-replace-logo: ${CAN_REPLACE_LOGO:false}
    model-load-balancing-enabled: ${MODEL_LB_ENABLED:false}
  cors:
    console-origins: ${CONSOLE_CORS_ALLOW_ORIGINS:*}
    web-origins: ${WEB_API_CORS_ALLOW_ORIGINS:*}

server:
  port: ${SERVER_PORT:5001}

logging:
  level:
    com.dify: INFO
    org.hibernate.SQL: WARN

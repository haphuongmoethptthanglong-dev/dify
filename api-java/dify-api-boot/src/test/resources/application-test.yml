spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:172.19.0.5}:${DB_PORT:5432}/${DB_DATABASE:dify}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:difyai123456}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:172.19.0.3}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:difyai123456}

  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

dify:
  edition: SELF_HOSTED
  version: 0.15.3-test
  check-update-url: ""
  init-password: ""
  security:
    secret-key: sk-test-secret-key-for-junit-contract-tests-min-256-bits
  features:
    can-replace-logo: false
    model-load-balancing-enabled: false
  cors:
    console-origins: "*"
    web-origins: "*"

logging:
  level:
    com.dify: DEBUG
    org.hibernate.SQL: WARN

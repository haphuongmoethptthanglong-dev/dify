spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:172.19.0.8}:${DB_PORT:5432}/${DB_DATABASE:dify}?stringtype=unspecified
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:difyai123456}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:172.19.0.2}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:difyai123456}

  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

dify:
  edition: SELF_HOSTED
  version: 0.15.3-test
  check-update-url: ""
  init-password: ""
  security:
    secret-key: sk-test-secret-key-for-junit-contract-tests-min-256-bits
  features:
    can-replace-logo: false
    model-load-balancing-enabled: false
    dataset-operator-enabled: false
    education-enabled: false
    enable-marketplace: false
    enable-trial-app: false
    enable-explore-banner: false
  login:
    enable-email-code-login: false
    enable-email-password-login: true
    enable-social-oauth-login: false
    allow-register: false
    allow-create-workspace: false
  mail:
    type: ""
  enterprise:
    enabled: false
  billing:
    enabled: false
  plugin:
    max-package-size: 10485760
  hosted:
    openai:
      paid-enabled: false
      trial-enabled: false
    anthropic:
      paid-enabled: false
      trial-enabled: false
    gemini:
      paid-enabled: false
      trial-enabled: false
    xai:
      paid-enabled: false
      trial-enabled: false
    deepseek:
      paid-enabled: false
      trial-enabled: false
    tongyi:
      paid-enabled: false
      trial-enabled: false
  cors:
    console-origins: "*"
    web-origins: "*"

logging:
  level:
    com.dify: DEBUG
    org.hibernate.SQL: WARN
